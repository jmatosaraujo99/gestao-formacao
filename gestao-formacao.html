let ultimaRota = null;
function render() {
  const foco = seletorFoco(document.activeElement), y = window.scrollY, mesmaRota = ultimaRota === location.hash;
  cache.clear();
  document.body.classList.toggle('sem-conta', REMOTO && !db);
  if (REMOTO && (!db || ui.novaPalavra)) {   // entrada na conta (ou dados ainda a chegar)
    document.getElementById('conteudo').innerHTML = vEntrar();
    document.getElementById('nav').innerHTML = '';
    document.title = 'Entrar · Gestão de Formação';
    const primeiro = document.querySelector('#conteudo input');
    if (primeiro && !document.activeElement?.matches?.('#conteudo input, #conteudo button')) primeiro.focus();
    ultimaRota = null;
    return;
  }
  nCampo = 0;
  aplicarTema();
  const r = rota();
  let html;
  try { html = ROTAS[r.nome](r.id); }
  catch (e) { console.error(e); html = vazio('Algo correu mal ao mostrar esta página.', String(e.message || e), '<a class="btn" href="#/painel">Voltar ao painel</a>'); }
  const faixaArmazenamento = armazenamentoOk ? '' : `<div class="faixa" role="alert">Este navegador não está a guardar os dados. Exporta uma cópia em Definições antes de fechar a página.</div>`;
  document.getElementById('conteudo').innerHTML = faixaArmazenamento + `<div id="faixa-ligacao">${faixaLigacaoHtml()}</div>` + html;
  document.getElementById('nav').innerHTML = navHtml(r.nome);
  if (REMOTO) mostrarLigacao(ligacao.estado, ligacao.erro);
  else document.getElementById('lateral-pe').textContent = 'Dados guardados neste navegador. Exporta cópias em Definições.';
  document.title = `${TITULOS[r.nome]} · Gestão de Formação`;
  ligarGrafico();
  if (mesmaRota) {
    window.scrollTo(0, y);
    const el = foco && document.querySelector(foco);
    if (el) el.focus({ preventScroll: true });
  }
  ultimaRota = location.hash;
}
function aplicarTema() {
  const t = db.perfil.tema;
  if (t === 'claro') document.documentElement.dataset.theme = 'light';
  else if (t === 'escuro') document.documentElement.dataset.theme = 'dark';
  else delete document.documentElement.dataset.theme;
}
function ir(hash) {
  if (location.hash === hash) render(); else location.hash = hash;
}

/* ---------- Vista: Painel ---------- */
function diasSemCopia() { return difDias(db.local.ultima_copia || db.local.criado_em || hoje(), hoje()); }
const precisaCopia = () => !REMOTO && db.formacoes.length > 0 && diasSemCopia() >= 7 && !(db.local.lembrar_copia_depois && db.local.lembrar_copia_depois > hoje());
function alertaHtml(a) {
  return `<li class="alerta ${a.adiado ? 'adiado' : ''}"><a class="alerta-lig" href="${a.link}"><span class="alerta-tit">${esc(a.titulo)}</span>${a.detalhe ? `<span class="alerta-det">${esc(a.detalhe)}</span>` : ''}</a>
    <div class="alerta-lado">${a.adiado
      ? `<span class="sub">${a.adiado.volta_em >= '9999' ? 'Escondido' : 'Volta ' + fmtData(a.adiado.volta_em)}</span><button class="lig-peq" data-acao="reporAviso" data-chave="${esc(a.chave)}">Repor</button>`
      : `${hl(...NIVEL_INFO[a.nivel])}<button class="lig-peq" data-acao="adiarAviso" data-chave="${esc(a.chave)}" aria-label="Adiar: ${esc(a.titulo)}">Adiar</button>`}</div></li>`;
}
// A próxima sessão da própria formadora (ou a que está a decorrer agora)
function proximaSessao() {
  const h = hoje(), d = new Date(), agora = hhmm(d.getHours() * 60 + d.getMinutes());
  return sessoesVisiveis().filter(s => s.data > h || (s.data === h && s.fim > agora)).sort(ordSessao)[0] || null;
}
// O quadro do topo do painel: saudação, próxima sessão e o essencial em números
function quadroHtml(novos, al, fin) {
  const h = hoje(), p = db.perfil, s = proximaSessao();
  const d = new Date(), agora = hhmm(d.getHours() * 60 + d.getMinutes());
  let seguir;
  if (s) {
    const f = form(s.formacao_id), e = ent(f.entidade_id);
    const aDecorrer = s.data === h && s.inicio <= agora;
    const quando = aDecorrer ? 'A decorrer agora' : s.data === h ? 'Hoje' : s.data === somaDias(h, 1) ? 'Amanhã' : cap(fmtDataDia(s.data));
    const falta = !aDecorrer && difDias(h, s.data) > 1 ? `, ${relativo(s.data)}` : '';
    seguir = `<p class="a-seguir-rot">${aDecorrer ? 'Agora' : 'Próxima sessão'}</p>
      <p class="a-seguir-quando"><span class="a-seguir-hora">${s.inicio}</span><span class="a-seguir-fim">até ${s.fim}</span><span class="a-seguir-dia">${esc(quando)}${esc(falta)}</span></p>
      <p class="a-seguir-tit"><a href="#/formacao/${f.id}">${esc(f.designacao)}</a>${s.provisoria ? '<span class="a-seguir-tag">Provisória</span>' : ''}</p>
      <p class="a-seguir-meta"><span class="ponto" style="--cor:${corEnt(e)}"></span>${esc([e?.nome, s.local || f.local].filter(Boolean).join(', ') || 'Sem local')}</p>`;
  } else {
    seguir = `<p class="a-seguir-rot">Próxima sessão</p><p class="a-seguir-tit" style="margin-top:0">Não tens sessões marcadas.</p><p class="a-seguir-meta">Quando confirmares uma formação, a próxima sessão aparece aqui.</p>`;
  }
  const urgentes = al.filter(a => a.nivel === 'urgente').length;
  const numeros = [
    novos.length ? `<li><a href="#/entrada"><strong>${novos.length}</strong><span>${novos.length === 1 ? 'pedido por rever' : 'pedidos por rever'}</span></a></li>` : '',
    `<li><a href="#t-tratar" data-acao="irTratar" class="${urgentes ? 'ha-urgentes' : ''}"><strong>${urgentes || al.length}</strong><span>${urgentes ? (urgentes === 1 ? 'aviso urgente' : 'avisos urgentes') : (al.length === 1 ? 'coisa por tratar' : 'coisas por tratar')}</span></a></li>`,
    `<li><a href="#/dinheiro"><strong>${esc(EUR0.format(fin.aReceber))}</strong><span>${fin.emAtraso > 0 ? `a receber, ${esc(EUR0.format(fin.emAtraso))} em atraso` : 'a receber'}</span></a></li>`
  ].join('');
  return `<section class="quadro" aria-labelledby="t-ola">
    <div class="quadro-topo">
      <div><p class="quadro-data">${esc(cap(fmtDataLonga(h)))}</p><h1 id="t-ola">Olá${p.nome ? ', ' + esc(primeiroNome(p.nome)) : ''}</h1></div>
      <div class="quadro-acoes"><button class="btn btn-giz" data-acao="novoPedido">${ic('entrada')} Colar pedido</button><button class="btn btn-marcador" data-acao="novaFormacao">${ic('mais')} Nova formação</button></div>
    </div>
    <div class="quadro-corpo"><div class="a-seguir">${seguir}</div><ul class="quadro-numeros" aria-label="Resumo">${numeros}</ul></div>
  </section>`;
}
function vPainel() {
  const h = hoje(), p = db.perfil;
  const novos = db.pedidos.filter(x => x.estado === 'novo');
  const todos = alertas(), al = todos.filter(a => !a.adiado), adi = todos.filter(a => a.adiado);
  const nCopia = diasSemCopia();
  const fin = financas(new Date().getFullYear());
  const proximas = db.formacoes.map(f => ({ f, r: resumo(f) }))
    .filter(x => ['pedido', 'proposta', 'confirmada', 'em_curso'].includes(x.r.fase))
    .sort((a, b) => (a.r.fase === 'em_curso' ? '0' : a.r.inicio || '9999').localeCompare(b.r.fase === 'em_curso' ? '0' : b.r.inicio || '9999')).slice(0, 6);

  return `
  ${quadroHtml(novos, al, fin)}
  ${precisaCopia() ? `<div class="faixa-aviso" role="status"><span><strong>${db.local.ultima_copia ? `Não fazes uma cópia há ${nCopia} dias.` : `Ainda não fizeste nenhuma cópia (${nCopia} dias).`}</strong> Os dados só existem neste navegador: se o limpares, perdes tudo.</span><button class="btn btn-peq" data-acao="exportarJSON">${ic('descarregar')} Exportar cópia</button><button class="lig-peq" data-acao="lembrarCopia">Lembrar daqui a 3 dias</button></div>` : ''}
  ${!p.fiscal_confirmado ? `<div class="faixa-aviso" role="status"><span><strong>Confirma o IVA e a retenção dos teus recibos.</strong> Sem isto, o valor que vais receber pode estar errado.</span><button class="btn btn-peq" data-acao="confirmarFiscal">Confirmar agora</button></div>` : ''}
  ${semanaHtml()}
  <div class="painel-grelha">
    <section class="bloco" aria-labelledby="t-tratar">
      <div class="bloco-cab"><h2 id="t-tratar">Por tratar</h2><span class="contador">${al.length}</span></div>
      ${al.length ? `<ul class="alertas">${al.map(alertaHtml).join('')}</ul>` : '<p class="vazio-txt">Está tudo em dia.</p>'}
      ${adi.length ? `<div style="margin-top:10px"><button class="lig-peq" data-acao="verAdiados" aria-expanded="${ui.verAdiados}">${ui.verAdiados ? 'Esconder' : 'Ver'} ${adi.length} ${adi.length === 1 ? 'aviso adiado' : 'avisos adiados'}</button></div>${ui.verAdiados ? `<ul class="alertas adiados">${adi.map(alertaHtml).join('')}</ul>` : ''}` : ''}
    </section>
    <div class="coluna">
      <section class="bloco" aria-labelledby="t-din">
        <div class="bloco-cab"><h2 id="t-din">Dinheiro</h2><a class="btn btn-peq" href="#/dinheiro">Ver tudo</a></div>
        <dl class="numeros">
          <div><dt>A receber</dt><dd>${euro(fin.aReceber)}</dd></div>
          <div><dt>Em atraso</dt><dd class="${fin.emAtraso > 0 ? 'mau' : ''}">${euro(fin.emAtraso)}${fin.nAtraso ? `<small>${fin.nAtraso} ${fin.nAtraso === 1 ? 'recibo' : 'recibos'}</small>` : ''}</dd></div>
          <div><dt>Por faturar</dt><dd>${euro(fin.porFaturar)}<small>horas já dadas</small></dd></div>
          <div><dt>Recebido em ${new Date().getFullYear()}</dt><dd>${euro(fin.recebidoAno)}</dd></div>
        </dl>
      </section>
      <section class="bloco" aria-labelledby="t-prox">
        <div class="bloco-cab"><h2 id="t-prox">Formações em curso e a seguir</h2></div>
        ${proximas.length ? `<ul class="prox">${proximas.map(({ f, r }) => { const e = ent(f.entidade_id); return `<li><a href="#/formacao/${f.id}" style="--cor:${corEnt(e)}">
          <div class="prox-linha"><span class="prox-tit">${esc(f.designacao)}</span>${chipFase(r.fase)}</div>
          <div class="prox-meta">${esc(e?.nome || 'Sem entidade')}, ${r.inicio ? (r.fase === 'em_curso' ? 'termina ' + fmtData(r.fim) : 'começa ' + fmtData(r.inicio)) : 'sem sessões'}${r.contratacaoTotal ? `, contratação ${r.contratacaoFeitos}/${r.contratacaoTotal}` : ''}</div>
          ${r.fase === 'em_curso' ? barraProgresso(r.horasDadas, r.horasMinhasPrevistas) : ''}</a></li>`; }).join('')}</ul>` : '<p class="vazio-txt">Sem formações marcadas.</p>'}
      </section>
    </div>
  </div>`;
}

function semanaHtml() {
  const h = hoje();
  const base = inicioSemana(somaDias(h, ui.semana * 7));
  const dias = [...Array(7)].map((_, i) => somaDias(base, i));
  const vis = sessoesVisiveis();
  const conf = idsEmConflito();
  let total = 0;
  const cols = dias.map(d => {
    const ss = vis.filter(s => s.data === d).sort(ordSessao);
    ss.forEach(s => { if (!s.provisoria) total += horasSessao(s); });
    const fer = feriado(d);
    return `<div class="dia ${d === h ? 'hoje' : ''} ${d < h ? 'passado' : ''}">
      <div class="dia-cab"><span class="dia-nome">${DIAS_CURTOS[dataDe(d).getDay()]}</span><span class="dia-num">${dataDe(d).getDate()}</span></div>
      ${fer ? `<div class="dia-feriado">${esc(fer)}</div>` : ''}
      <div class="dia-sessoes">${ss.map(s => sessaoBloco(s, conf.has(s.id))).join('') || '<span class="dia-livre">Livre</span>'}</div></div>`;
  }).join('');
  const titulo = ui.semana === 0 ? 'Esta semana' : ui.semana === 1 ? 'Próxima semana' : ui.semana === -1 ? 'Semana passada' : `Semana de ${fmtData(base)}`;
  return `<section class="semana" aria-labelledby="t-semana">
    <div class="semana-cab"><div><h2 id="t-semana">${titulo}</h2><p class="sub">${fmtData(base)} a ${fmtData(dias[6])}, ${horasTxt(total)} confirmadas</p></div>
    <div class="nav-sem"><button class="btn-icone" data-acao="semana" data-d="-1" aria-label="Semana anterior">${ic('esq')}</button>${ui.semana !== (fimDeSemana(h) ? 1 : 0) ? '<button class="btn btn-peq" data-acao="semanaAtual">Voltar</button>' : ''}<button class="btn-icone" data-acao="semana" data-d="1" aria-label="Semana seguinte">${ic('dir')}</button></div></div>
    <div class="semana-dias">${cols}</div></section>`;
}
function sessaoBloco(s, conflito) {
  const f = form(s.formacao_id), e = ent(f.entidade_id);
  return `<a class="sessao ${s.provisoria ? 'provisoria' : ''} ${conflito ? 'conflito' : ''}" href="#/formacao/${f.id}" style="--cor:${corEnt(e)}">
    <span class="sessao-hora">${s.inicio}–${s.fim}</span><span class="sessao-tit">${esc(f.designacao)}</span><span class="sessao-ent">${esc(e?.nome || '')}</span>
    ${s.provisoria ? '<span class="sessao-tag">Provisória</span> ' : ''}${conflito ? '<span class="sessao-tag tag-conf">Sobreposição</span>' : ''}</a>`;
}

/* ---------- Vista: Caixa de entrada ---------- */
function vEntrada() {
  const novos = db.pedidos.filter(p => p.estado === 'novo');
  const tratados = db.pedidos.filter(p => p.estado !== 'novo');
  const lista = ui.tabEntrada === 'novos' ? novos : tratados;
  const sep = (k, t) => `<button role="tab" aria-selected="${ui.tabEntrada === k}" data-acao="tabEntrada" data-t="${k}">${t}</button>`;
  return `<header class="cab-pagina"><div><h1>Caixa de entrada</h1><p class="sub">Pedidos, propostas e alterações que chegam por email. Revês os dados e decides o que entra.</p></div>
    <div class="cab-acoes"><button class="btn btn-prim" data-acao="novoPedido">${ic('mais')} Adicionar pedido</button></div></header>
    <div class="separadores" role="tablist">${sep('novos', `Por rever (${novos.length})`)}${sep('tratados', `Tratados (${tratados.length})`)}</div>
    ${lista.length ? `<ul class="pedidos">${lista.map(pedidoCartao).join('')}</ul>`
      : ui.tabEntrada === 'novos' ? vazio('Não há pedidos por rever.', 'Quando chegar um email com um pedido, cola-o em "Adicionar pedido". Também aceita o JSON que o teu assistente gera a partir dos emails.') : vazio('Ainda não trataste nenhum pedido.')}`;
}
function pedidoCartao(p) {
  const d = p.dados || {};
  const mini = [d.codigo ? `${d.referencial || ''} ${d.codigo}`.trim() : d.codigo_acao ? `Ação ${d.codigo_acao}` : '', d.horas ? horasTxt(d.horas) : '', d.sessoes?.length ? `${d.sessoes.length} ${d.sessoes.length === 1 ? 'sessão' : 'sessões'}` : '', d.valor_hora ? `${num(d.valor_hora)} €/h` : ''].filter(Boolean);
  return `<li class="pedido"><a href="#/pedido/${p.id}">
    <div class="pedido-topo"><span class="pedido-de">${esc(nomeRemetente(p.remetente) || 'Sem remetente')}</span><span>${fmtData(p.recebido_em.slice(0, 10))}, ${p.recebido_em.slice(11, 16)}</span></div>
    <div class="pedido-assunto">${esc(p.assunto)}</div>${p.resumo ? `<p class="pedido-resumo">${esc(p.resumo)}</p>` : ''}
    <div class="pedido-chips">${chipTipo(p.tipo)}${p.estado === 'convertido' ? hl('Tratado', 'cinza') : p.estado === 'descartado' ? hl('Descartado', 'cinza') : ''}${mini.map(x => `<span class="dado-mini">${esc(x)}</span>`).join('')}</div></a></li>`;
}

function vPedido(id) {
  const p = db.pedidos.find(x => x.id === id);
  if (!p) return naoEncontrado('Este pedido já não existe.', '#/entrada', 'Voltar à caixa de entrada');
  const d = p.dados || {};
  const ehAlteracao = ['alteracao', 'cancelamento'].includes(p.tipo);
  const entSug = entidadePorEmail(d.entidade?.email) || entidadePorEmail(emailRemetente(p.remetente)) || entidadePorNome(d.entidade?.nome);
  const cab = `<nav class="migalhas" aria-label="Caminho"><a href="#/entrada">Caixa de entrada</a></nav>
    <header class="cab-pagina"><div><h1>${esc(p.assunto)}</h1><p class="sub">${esc(p.remetente || 'Sem remetente')}, recebido ${fmtDataDia(p.recebido_em.slice(0, 10))} às ${p.recebido_em.slice(11, 16)}</p></div>
    ${p.estado === 'novo' ? '' : `<div class="cab-acoes"><button class="btn" data-acao="reabrirPedido" data-id="${p.id}">${ic('repetir')} Pôr outra vez por rever</button></div>`}</header>`;
  const esquerda = `<section class="bloco"><div class="bloco-cab"><h2>Email</h2>${chipTipo(p.tipo)}</div>${p.resumo ? `<p class="resumo-ia">${esc(p.resumo)}</p>` : ''}<pre class="email">${esc(p.corpo || '(sem texto)')}</pre></section>`;
  let direita;
  if (p.estado === 'convertido' && p.formacao_id && form(p.formacao_id)) {
    direita = `<section class="bloco"><h2>Tratado</h2><p class="txt-sec" style="margin-top:8px">${ehAlteracao ? 'Alteração aplicada em' : 'Deu origem a'} <a href="#/formacao/${p.formacao_id}">${esc(form(p.formacao_id).designacao)}</a>.</p></section>`;
  } else if (p.estado !== 'novo') {
    direita = `<section class="bloco"><h2>${p.estado === 'descartado' ? 'Descartado' : 'Tratado'}</h2><p class="txt-sec" style="margin-top:8px">Não foi criada nenhuma formação a partir deste email.</p></section>`;
  } else if (ehAlteracao) {
    direita = painelAlteracao(p);
  } else {
    direita = formPedido(p, d, entSug);
  }
  return cab + `<div class="duas-col">${direita}${esquerda}</div>`;
}

function formPedido(p, d, entSug) {
  const linhas = (d.sessoes || []).map(s => `${fmtPT(s.data)} ${s.inicio || '??:??'}-${s.fim || '??:??'}`).join('\n');
  const totalH = soma((d.sessoes || []).filter(s => s.inicio && s.fim), horasSessao);
  const duv = [...(p.duvidas || [])];
  if (d.horas && totalH && Math.abs(totalH - d.horas) > 0.01) duv.push(`As sessões somam ${horasTxt(totalH)}, mas o email fala em ${horasTxt(d.horas)}.`);
  if (!entSug) duv.push('Não reconheci a entidade. Escolhe uma da lista ou cria uma nova.');
  for (const s of d.sessoes || []) {
    if (feriado(s.data)) duv.push(`${fmtPT(s.data)} é feriado (${feriado(s.data)}).`);
    if (s.inicio && s.fim) {
      const c = conflitosCom({ ...s, id: '__novo' });
      if (c.length) duv.push(`${fmtPT(s.data)}, ${s.inicio}–${s.fim}: sobrepõe-se a ${form(c[0].formacao_id).designacao} (${c[0].inicio}–${c[0].fim}).`);
    }
  }
  const nomeNova = d.entidade?.nome || dominio(emailRemetente(p.remetente));
  return `<form class="bloco" data-form="pedidoCriar"><input type="hidden" name="pedido_id" value="${p.id}">
    <div class="bloco-cab"><h2>Dados encontrados</h2>${hl(...CONFIANCA[p.confianca || 'media'])}</div>
    ${duv.length ? `<ul class="duvidas">${duv.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    <div class="grelha-campos">
      ${selectEntidade(entSug ? entSug.id : '__nova', nomeNova)}
      ${campoSelect('Criar como', 'estado', 'pedido', [['pedido', 'Pedido (ainda por responder)'], ['proposta', 'Proposta enviada'], ['confirmada', 'Confirmada']])}
      ${campo('Designação', 'designacao', d.designacao || '', { obrig: true, col2: true })}
      ${campoSelect('Referencial', 'referencial', d.referencial || (d.codigo ? 'UFCD' : 'Curso livre'), REFERENCIAIS)}
      ${campo('Código (UFCD/UC)', 'codigo', d.codigo || '')}
      ${campo('Código da ação', 'codigo_acao', d.codigo_acao || '')}
      ${campo('Turma', 'turma', d.turma || '')}
      ${campo('Local', 'local', d.local || '', { col2: true })}
      ${campoSelect('Modalidade', 'modalidade', d.modalidade || 'presencial', MODALIDADES)}
      ${campo('Horas', 'horas_previstas', d.horas ?? totalH ?? '', { tipo: 'number', passo: '0.5', min: 0 })}
      ${campo('Valor por hora (€)', 'valor_hora', d.valor_hora ?? db.perfil.valor_hora_padrao, { tipo: 'number', passo: '0.01', min: 0 })}
      ${campo('Prazo para responder', 'prazo_resposta', d.prazo_resposta || '', { tipo: 'date' })}
      ${campo('Coordenação', 'coordenador_nome', d.coordenador?.nome || nomeRemetente(p.remetente))}
      ${campo('Contacto da coordenação', 'coordenador_contacto', [d.coordenador?.email || emailRemetente(p.remetente), d.coordenador?.telefone].filter(Boolean).join(', '))}
      ${campoArea('Sessões', 'sessoes', linhas, { linhas: Math.max(4, (d.sessoes || []).length + 1), mono: true, ajuda: 'Uma por linha: dd/mm/aaaa hh:mm-hh:mm' })}
      ${campoArea('Documentos que pedem', 'documentos', (d.documentos_pedidos || []).join('\n'), { linhas: 3, ajuda: 'Os que ainda não estão na lista habitual entram na contratação desta formação. Um por linha.' })}
    </div>
    <div class="bloco-acoes"><button class="btn btn-prim" type="submit">Criar formação</button><button class="btn" type="button" data-acao="descartarPedido" data-id="${p.id}">Descartar</button></div></form>`;
}

function painelAlteracao(p) {
  const d = p.dados || {};
  const alts = d.alteracoes || [];
  const sug = sugerirFormacao(p);
  const opts = db.formacoes.filter(f => !['recusada', 'cancelada'].includes(f.estado)).map(f => `<option value="${f.id}" ${sug && sug.id === f.id ? 'selected' : ''}>${esc(f.designacao)} (${esc(ent(f.entidade_id)?.nome || '')})</option>`).join('');
  const linhas = alts.map(a => {
    const s = sug && encontrarSessao(sug.id, a.original);
    return `<li class="alt"><div><span class="alt-de">${esc(cap(fmtDataDia(a.original.data)))}${a.original.inicio ? ', ' + a.original.inicio : ''}</span><br>passa para <span class="alt-para">${a.nova ? esc(cap(fmtDataDia(a.nova.data))) + ', ' + a.nova.inicio + '–' + a.nova.fim : 'cancelada'}</span></div>${s ? hl('Sessão encontrada', 'verde') : hl('Sessão não encontrada', 'rosa')}</li>`;
  }).join('');
  return `<section class="bloco"><div class="bloco-cab"><h2>${p.tipo === 'cancelamento' ? 'Cancelamento pedido' : 'Alteração pedida'}</h2>${hl(...CONFIANCA[p.confianca || 'media'])}</div>
    ${(p.duvidas || []).length ? `<ul class="duvidas">${p.duvidas.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    <div class="campo"><label for="rel-formacao">Formação</label><select id="rel-formacao" data-mudar="relFormacao" data-id="${p.id}"><option value="">Escolhe a formação</option>${opts}</select></div>
    ${alts.length ? `<ul class="alteracoes">${linhas}</ul>` : '<p class="txt-sec" style="margin-top:12px">Não há datas concretas para alterar. Abre a formação e faz a mudança à mão.</p>'}
    <div class="bloco-acoes">${alts.length && sug ? `<button class="btn btn-prim" data-acao="aplicarAlteracao" data-id="${p.id}">Aplicar ${alts.length === 1 ? 'alteração' : 'alterações'}</button>` : ''}${sug ? `<a class="btn" href="#/formacao/${sug.id}">Abrir formação</a>` : ''}<button class="btn" data-acao="descartarPedido" data-id="${p.id}">Marcar como tratado</button></div></section>`;
}

/* ---------- Vista: Formações ---------- */
const FILTROS_FORM = [['ativas', 'Ativas'], ['pipeline', 'Pedidos e propostas'], ['curso', 'Confirmadas'], ['fechar', 'Por fechar'], ['arquivo', 'Arquivo'], ['todas', 'Todas']];
function filtrarFormacoes() {
  const q = ui.pesquisa.trim().toLowerCase();
  const fl = ui.filtroForm;
  return db.formacoes.map(f => ({ f, r: resumo(f), e: ent(f.entidade_id) })).filter(({ f, r, e }) => {
    const ok = fl === 'todas' || (fl === 'ativas' && ['pedido', 'proposta', 'confirmada', 'em_curso', 'concluida'].includes(r.fase)) || (fl === 'pipeline' && ['pedido', 'proposta'].includes(r.fase))
      || (fl === 'curso' && ['confirmada', 'em_curso'].includes(r.fase)) || (fl === 'fechar' && r.fase === 'concluida') || (fl === 'arquivo' && ['fechada', 'recusada', 'cancelada'].includes(r.fase));
    if (!ok) return false;
    return !q || [f.designacao, f.codigo, f.codigo_acao, f.turma, e?.nome, f.local].some(v => String(v || '').toLowerCase().includes(q));
  }).sort((a, b) => (a.r.inicio || '9999').localeCompare(b.r.inicio || '9999'));
}
function listaFormacoes() {
  const l = filtrarFormacoes();
  if (!l.length) return vazio(ui.pesquisa ? 'Nenhuma formação corresponde à pesquisa.' : 'Não há formações neste filtro.', '', ui.pesquisa ? '' : '<button class="btn btn-prim" data-acao="novaFormacao">Nova formação</button>');
  return `<div class="bloco bloco-tabela"><div class="tabela-wrap"><table class="tabela tabela-cartoes">
    <thead><tr><th>Formação</th><th>Entidade</th><th>Datas</th><th>Horas</th><th>Contratação</th><th>Estado</th></tr></thead>
    <tbody>${l.map(({ f, r, e }) => `<tr>
      <td class="td-principal"><a class="lig-forte" href="#/formacao/${f.id}">${esc(f.designacao)}</a><div class="meta">${esc(codigoTxt(f))}${f.turma ? ', turma ' + esc(f.turma) : ''}</div></td>
      <td data-l="Entidade"><span class="ent"><span class="ponto" style="--cor:${corEnt(e)}"></span>${esc(e?.nome || '—')}</span></td>
      <td data-l="Datas">${r.inicio ? fmtData(r.inicio) + (r.fim && r.fim !== r.inicio ? ' a ' + fmtData(r.fim) : '') : 'Por agendar'}</td>
      <td data-l="Horas">${barraProgresso(r.horasDadas, r.horasMinhasPrevistas)}</td>
      <td data-l="Contratação">${r.contratacaoTotal ? `${r.contratacaoFeitos} de ${r.contratacaoTotal}` : '—'}</td>
      <td data-l="Estado">${chipFase(r.fase)}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function vFormacoes() {
  return `<header class="cab-pagina"><div><h1>Formações</h1><p class="sub">${db.formacoes.length} no total</p></div><div class="cab-acoes"><button class="btn btn-prim" data-acao="novaFormacao">${ic('mais')} Nova formação</button></div></header>
    <div class="filtros"><div class="segmentos" role="group" aria-label="Filtrar">${FILTROS_FORM.map(([k, t]) => `<button aria-pressed="${ui.filtroForm === k}" data-acao="filtroForm" data-f="${k}">${t}</button>`).join('')}</div>
    <input class="pesquisa" type="search" placeholder="Pesquisar curso, código, turma, entidade" aria-label="Pesquisar formações" value="${esc(ui.pesquisa)}" data-pesquisa></div>
    <div id="lista-formacoes">${listaFormacoes()}</div>`;
}

/* ---------- Vista: Ficha da formação ---------- */
const PASSOS = [['pedido', 'Pedido'], ['proposta', 'Proposta'], ['confirmada', 'Confirmada'], ['em_curso', 'Em curso'], ['concluida', 'Por fechar'], ['fechada', 'Fechada']];
function passosHtml(fase) {
  if (['recusada', 'cancelada'].includes(fase)) return `<p class="passos-fim">${chipFase(fase)}</p>`;
  const idx = PASSOS.findIndex(p => p[0] === fase);
  return `<ol class="passos" aria-label="Fase da formação">${PASSOS.map(([k, t], i) => `<li class="${i < idx ? 'feito' : i === idx ? 'atual' : ''}" ${i === idx ? 'aria-current="step"' : ''}>${t}</li>`).join('')}</ol>`;
}
function vFormacao(id) {
  const f = form(id);
  if (!f) return naoEncontrado('Esta formação já não existe.', '#/formacoes', 'Ver formações');
  const e = ent(f.entidade_id), r = resumo(f);
  const conf = idsEmConflito();
  const h = hoje();
  const ativasIdx = new Map(r.ativas.map((s, i) => [s.id, i]));
  const sessoesHtml = r.sessoes.map(s => {
    const passada = s.data < h;
    const est = s.estado === 'prevista' && passada ? 'realizada' : s.estado;
    const fer = feriado(s.data);
    const n = ativasIdx.has(s.id) ? `Sessão ${ativasIdx.get(s.id) + 1}` : 'Cancelada';
    return `<li class="sess-linha ${s.estado === 'cancelada' ? 'cancelada' : ''}">
      <div class="sess-quando"><span class="sess-n">${n}</span><span class="sess-data">${esc(cap(fmtDataDia(s.data)))}</span><span class="sess-hora">${s.inicio}–${s.fim}, ${horasTxt(horasSessao(s))}</span>${s.local ? `<span class="sess-local">${esc(s.local)}</span>` : ''}${s.formador ? hl('Dada por ' + s.formador, 'cinza') : ''}${fer ? hl('Feriado: ' + fer, 'laranja') : ''}${conf.has(s.id) ? hl('Sobreposição', 'rosa') : ''}</div>
      <div class="sess-ctrl"><label class="sr-only" for="es-${s.id}">Estado da sessão de ${fmtData(s.data)}</label>
        <select id="es-${s.id}" class="sel-peq" data-mudar="estadoSessao" data-id="${s.id}">${[['prevista', 'Agendada'], ['realizada', 'Dada'], ['cancelada', 'Cancelada']].map(([v, t]) => `<option value="${v}" ${v === est ? 'selected' : ''}>${t}</option>`).join('')}</select>
        ${sessaoDada(s) && !s.formador ? `<label class="chk chk-peq"><input type="checkbox" data-mudar="sumario" data-id="${s.id}" ${s.sumario_entregue ? 'checked' : ''}> Sumário entregue</label>` : ''}
        <button class="btn-icone btn-peq-ic" data-acao="editarSessao" data-id="${s.id}" aria-label="Editar sessão de ${fmtData(s.data)}">${ic('lapis')}</button>
        <button class="btn-icone btn-peq-ic" data-acao="apagarSessao" data-id="${s.id}" aria-label="Apagar sessão de ${fmtData(s.data)}">${ic('lixo')}</button></div></li>`;
  }).join('');

  // Os documentos pessoais face às datas desta formação
  const risco = documentosEmRisco(f);
  const docsHtml = !['pedido', 'proposta', 'confirmada', 'em_curso'].includes(r.fase) || !db.documentos.some(d => d.data_validade) ? ''
    : risco.length
      ? `<p class="cl-docs com-risco"><strong>Documentos a tratar para esta formação:</strong> ${risco.map(d => `${esc(d.titulo)} (${d.data_validade < h ? 'expirou a' : 'expira a'} ${fmtData(d.data_validade)})`).join('; ')}. <a href="#/documentos">Ver documentos</a></p>`
      : `<p class="cl-docs">Os teus documentos estão válidos até ao fim desta formação. <a href="#/documentos">Ver documentos</a></p>`;
  const checklistHtml = FASES.map(([fase, titulo]) => {
    const itens = checklistDe(f.id).filter(c => c.fase === fase);
    const feitos = itens.filter(c => c.estado !== 'pendente').length;
    return `<div class="cl-fase"><div class="cl-cab"><h3>${titulo}</h3><span class="sub">${feitos} de ${itens.length}</span></div>
      ${fase === 'contratacao' ? docsHtml : ''}
      <ul class="cl-lista">${itens.map(c => `<li class="cl-item ${c.estado}">
        <label class="chk"><input type="checkbox" data-mudar="checklist" data-id="${c.id}" ${c.estado === 'feito' ? 'checked' : ''} ${c.estado === 'nao_aplica' ? 'disabled' : ''}><span>${esc(c.titulo)}</span></label>
        ${c.estado === 'feito' && c.data ? `<span class="cl-data">${fmtData(c.data)}</span>` : ''}${c.estado === 'nao_aplica' ? '<span class="cl-data">Não se aplica</span>' : ''}
        <span class="cl-acoes">${c.estado !== 'feito' ? `<button class="lig-peq" data-acao="naChecklist" data-id="${c.id}">${c.estado === 'nao_aplica' ? 'Repor' : 'Não se aplica'}</button>` : ''}<button class="btn-icone btn-peq-ic" data-acao="apagarChecklist" data-id="${c.id}" aria-label="Apagar ${esc(c.titulo)}">${ic('lixo')}</button></span></li>`).join('')}</ul>
      </div>`;
  }).join('') + `<div class="cl-novo"><label class="sr-only" for="novo-tarefa">Nova tarefa</label><input id="novo-tarefa" placeholder="Acrescentar tarefa" data-enter="addChecklist" data-fid="${f.id}">
      <label class="sr-only" for="novo-fase">Em que fase</label><select id="novo-fase" class="sel-peq">${FASES.map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select>
      <button class="btn btn-peq" data-acao="addChecklist" data-fid="${f.id}">Acrescentar</button></div>`;

  const hist = db.historico.filter(x => x.formacao_id === f.id).slice(0, 10);
  const pedido = f.pedido_id && db.pedidos.find(p => p.id === f.pedido_id);

  return `<nav class="migalhas" aria-label="Caminho"><a href="#/formacoes">Formações</a></nav>
  <header class="ficha-cab">
    <div class="cab-pagina" style="margin-bottom:0"><h1>${esc(f.designacao)}</h1>
      <div class="ficha-acoes"><label class="sr-only" for="estado-f">Estado</label><select id="estado-f" class="sel-peq" style="padding:9px 10px;font-size:14px" data-mudar="estadoFormacao" data-id="${f.id}">${ESTADOS_FORM.map(([v, t]) => `<option value="${v}" ${v === f.estado ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <button class="btn" data-acao="editarFormacao" data-id="${f.id}">${ic('lapis')} Editar</button>
      <button class="btn" data-acao="icsFormacao" data-id="${f.id}">${ic('descarregar')} Calendário</button>
      <button class="btn-icone" data-acao="apagarFormacao" data-id="${f.id}" aria-label="Apagar formação">${ic('lixo')}</button></div></div>
    <div class="ficha-linha"><span class="ent"><span class="ponto" style="--cor:${corEnt(e)}"></span>${e ? `<a href="#/entidades">${esc(e.nome)}</a>` : 'Sem entidade'}</span><span>${esc(codigoTxt(f))}</span>${f.turma ? `<span>Turma ${esc(f.turma)}</span>` : ''}<span>${esc((MODALIDADES.find(m => m[0] === f.modalidade) || ['', f.modalidade])[1])}</span>${(f.coformadores || []).length ? `<span>Coformação com ${esc(f.coformadores.join(', '))}</span>` : ''}</div>
  </header>
  ${passosHtml(r.fase)}
  <div class="duas-col">
    <div class="coluna">
      <section class="bloco" aria-labelledby="t-sess">
        <div class="bloco-cab"><h2 id="t-sess">Sessões</h2><span class="sub">${r.ativas.length} ${r.ativas.length === 1 ? 'sessão' : 'sessões'}, ${horasTxt(r.horasAgendadas)} de ${horasTxt(f.horas_previstas)}</span></div>
        ${r.horasOutros > 0 ? `<p class="nota">Coformação: ${horasTxt(r.horasMinhasPrevistas)} são tuas e ${horasTxt(r.horasOutros)} de ${esc([...new Set(r.ativas.filter(x => x.formador).map(x => x.formador))].join(', '))}. Só as tuas contam para o dinheiro, os sumários e a tua agenda.</p>` : ''}
        ${r.faltaAgendar > 0 ? `<p class="nota nota-atencao">Faltam agendar ${horasTxt(r.faltaAgendar)}.</p>` : ''}${r.faltaAgendar < 0 ? `<p class="nota nota-atencao">As sessões somam mais ${horasTxt(-r.faltaAgendar)} do que as horas previstas.</p>` : ''}
        ${r.sessoes.length ? `<ol class="sessoes-lista">${sessoesHtml}</ol>` : '<p class="vazio-txt">Ainda não há sessões.</p>'}
        <div class="bloco-acoes"><button class="btn" data-acao="novaSessao" data-id="${f.id}">${ic('mais')} Adicionar sessão</button><button class="btn" data-acao="gerarSessoes" data-id="${f.id}">${ic('cal')} Gerar várias sessões</button></div>
      </section>
      <section class="bloco" aria-labelledby="t-cl"><div class="bloco-cab"><h2 id="t-cl">O que está tratado</h2></div>${checklistHtml}</section>
    </div>
    <div class="coluna">
      <section class="bloco" aria-labelledby="t-dados"><div class="bloco-cab"><h2 id="t-dados">Dados</h2></div>
        <dl class="lista-dados">
          <dt>Entidade</dt><dd>${esc(e?.nome || '—')}</dd>
          <dt>Código</dt><dd>${f.codigo ? esc(f.referencial + ' ' + f.codigo) : '—'}</dd>
          <dt>Ação</dt><dd>${esc(f.codigo_acao || '—')}</dd>
          <dt>Turma</dt><dd>${esc(f.turma || '—')}</dd>
          <dt>Local</dt><dd>${esc(f.local || '—')}</dd>
          <dt>Coordenação</dt><dd>${esc([f.coordenador_nome, f.coordenador_contacto].filter(Boolean).join(', ') || '—')}</dd>
          ${(f.coformadores || []).length ? `<dt>Coformação</dt><dd>${esc(f.coformadores.join(', '))}</dd>` : ''}
          ${f.prazo_resposta && ['pedido', 'proposta'].includes(f.estado) ? `<dt>Responder até</dt><dd>${fmtData(f.prazo_resposta)}</dd>` : ''}
          ${pedido ? `<dt>Origem</dt><dd><a href="#/pedido/${pedido.id}">Email: ${esc(pedido.assunto)}</a></dd>` : ''}
          ${f.notas ? `<dt>Notas</dt><dd>${esc(f.notas)}</dd>` : ''}
        </dl></section>
      <section class="bloco" aria-labelledby="t-fin"><div class="bloco-cab"><h2 id="t-fin">Dinheiro</h2></div>
        <dl class="lista-dados">
          <dt>Valor por hora</dt><dd class="num">${euro(f.valor_hora)}</dd>
          <dt>Valor previsto</dt><dd class="num">${euro(r.valorPrevisto)} <span class="sub">(${horasTxt(r.horasMinhasPrevistas)}${r.horasOutros ? ' tuas' : ''})</span></dd>
          <dt>Horas dadas</dt><dd class="num">${horasTxt(r.horasDadas)}, ${euro(r.valorDado)}</dd>

          <dt>Recebido</dt><dd class="num">${euro(r.recebido)}</dd>
          <dt>Por faturar</dt><dd class="num ${r.porFaturar > 0 ? 'destaque' : ''}">${euro(r.porFaturar)}${r.porFaturarHoras ? ` <span class="sub">(${horasTxt(r.porFaturarHoras)})</span>` : ''}</dd>
        </dl>
        ${r.recibos.length ? `<ul class="recibos-mini">${r.recibos.map(rc => `<li><div class="r-info"><div class="r-tit">${esc(rc.numero || 'Recibo sem número')}</div><div class="meta">${rc.data_emissao ? 'Emitido a ' + fmtData(rc.data_emissao) : 'Por emitir'}, ${euro(calcRecibo(rc).liquido)}${rc.data_pagamento ? ', pago a ' + fmtData(rc.data_pagamento) : rc.data_prevista_pagamento ? ', previsto ' + fmtData(rc.data_prevista_pagamento) : ''}</div></div>
          <div class="r-acoes">${chipRecibo(rc)}${!rc.data_pagamento && rc.data_emissao ? `<button class="btn btn-peq" data-acao="pagarRecibo" data-id="${rc.id}">Marcar pago</button>` : ''}<button class="btn-icone btn-peq-ic" data-acao="editarRecibo" data-id="${rc.id}" aria-label="Editar ${esc(rc.numero || 'recibo')}">${ic('lapis')}</button></div></li>`).join('')}</ul>` : ''}
        <div class="bloco-acoes"><button class="btn ${r.porFaturarHoras > 0 ? 'btn-prim' : ''}" data-acao="novoRecibo" data-id="${f.id}">${ic('mais')} Registar recibo</button></div></section>
      <section class="bloco" aria-labelledby="t-hist"><div class="bloco-cab"><h2 id="t-hist">Histórico</h2></div>
        ${hist.length ? `<ul class="historico">${hist.map(x => `<li><time datetime="${x.quando}">${fmtData(x.quando.slice(0, 10))}</time><span>${esc(x.texto)}</span></li>`).join('')}</ul>` : '<p class="vazio-txt">Sem registos.</p>'}</section>
    </div>
  </div>`;
}

/* ---------- Vista: Calendário ---------- */
function vCalendario() {
  const h = hoje();
  const mes = ui.mes || h.slice(0, 8) + '01';
  const [y, m] = mes.split('-').map(Number);
  const ultimo = `${y}-${pad(m)}-${pad(new Date(y, m, 0).getDate())}`;
  const ini = inicioSemana(mes), fimG = somaDias(inicioSemana(ultimo), 6);
  const dias = []; for (let d = ini; d <= fimG; d = somaDias(d, 1)) dias.push(d);
  const sess = sessoesVisiveis().filter(s => ui.calProvisorias || !s.provisoria);
  const conf = idsEmConflito();
  const porDia = agrupar(sess, s => s.data);
  const sel = ui.diaSel && ui.diaSel.slice(0, 7) === mes.slice(0, 7) ? ui.diaSel : (h.slice(0, 7) === mes.slice(0, 7) ? h : mes);
  const doMes = sess.filter(s => s.data.startsWith(mes.slice(0, 7)));
  const totalH = soma(doMes.filter(s => !s.provisoria), horasSessao);

  const cels = dias.map(d => {
    const ss = (porDia[d] || []).sort(ordSessao);
    const fer = feriado(d);
    const rotulo = `${cap(fmtDataLonga(d))}${ss.length ? `, ${ss.length} ${ss.length === 1 ? 'sessão' : 'sessões'}` : ''}${fer ? ', feriado' : ''}`;
    return `<button type="button" class="cal-dia ${d.slice(0, 7) !== mes.slice(0, 7) ? 'fora' : ''} ${d === h ? 'hoje' : ''} ${d === sel ? 'sel' : ''}" data-acao="diaSel" data-d="${d}" aria-label="${esc(rotulo)}" aria-pressed="${d === sel}">
      <span class="cal-num">${dataDe(d).getDate()}</span>${fer ? `<span class="cal-fer">${esc(fer)}</span>` : ''}
      ${ss.slice(0, 3).map(s => { const f = form(s.formacao_id), e = ent(f.entidade_id); return `<span class="cal-chip ${s.provisoria ? 'provisoria' : ''} ${conf.has(s.id) ? 'conflito' : ''}" style="--cor:${corEnt(e)}">${s.inicio} ${esc(f.designacao)}</span>`; }).join('')}
      ${ss.length > 3 ? `<span class="cal-mais">mais ${ss.length - 3}</span>` : ''}</button>`;
  }).join('');
  const doDia = (porDia[sel] || []).sort(ordSessao);
  const entsMes = [...new Set(doMes.map(s => form(s.formacao_id).entidade_id))].map(ent).filter(Boolean);

  return `<header class="cab-pagina"><div><h1>Calendário</h1><p class="sub">${horasTxt(totalH)} confirmadas em ${MESES[m - 1]}</p></div>
    <div class="cab-acoes"><button class="btn" data-acao="exportarICS">${ic('descarregar')} Exportar para o calendário (.ics)</button></div></header>
    <div class="cal-barra"><div class="cal-nav"><button class="btn-icone" data-acao="mes" data-d="-1" aria-label="Mês anterior">${ic('esq')}</button><h2 class="cal-titulo">${cap(MESES[m - 1])} ${y}</h2><button class="btn-icone" data-acao="mes" data-d="1" aria-label="Mês seguinte">${ic('dir')}</button>${mes.slice(0, 7) !== h.slice(0, 7) ? '<button class="btn btn-peq" data-acao="mes" data-d="0">Hoje</button>' : ''}</div>
    <label class="chk"><input type="checkbox" data-mudar="provisorias" ${ui.calProvisorias ? 'checked' : ''}> Mostrar pedidos e propostas</label></div>
    ${entsMes.length ? `<ul class="legenda" aria-label="Legenda">${entsMes.map(e => `<li><span class="ponto" style="--cor:${corEnt(e)}"></span>${esc(e.nome)}</li>`).join('')}${ui.calProvisorias ? '<li><span class="ponto ponto-prov"></span>Provisória</li>' : ''}</ul>` : ''}
    <div class="cal"><div class="cal-grelha">${[1, 2, 3, 4, 5, 6, 0].map(d => `<div class="cal-cab" aria-hidden="true">${DIAS_CURTOS[d]}</div>`).join('')}${cels}</div>

function dadosMensais(ano) {
  const h = hoje();
  const meses = Array.from({ length: 12 }, () => ({ dadas: 0, agendadas: 0, horasD: 0, horasA: 0 }));
  for (const s of db.sessoes) {
    if (s.estado === 'cancelada' || s.formador || !s.data.startsWith(String(ano))) continue;
    const f = form(s.formacao_id);
    if (!f || f.estado !== 'confirmada') continue;
    const hs = horasSessao(s), v = hs * (Number(f.valor_hora) || 0), m = meses[Number(s.data.slice(5, 7)) - 1];
    if (sessaoDada(s)) { m.dadas += v; m.horasD += hs; } else { m.agendadas += v; m.horasA += hs; }
  }
  return meses.map(m => ({ ...m, dadas: arred(m.dadas), agendadas: arred(m.agendadas) }));
}
function passoBonito(x) {
  const p = Math.pow(10, Math.floor(Math.log10(x)));
  for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= x) return k * p;
  return 10 * p;
}
function graficoHtml(ano) {
  const meses = dadosMensais(ano);
  if (Math.max(...meses.map(m => m.dadas + m.agendadas)) <= 0) return '<p class="vazio-txt">Sem sessões confirmadas neste ano.</p>';
  const tabela = `<div class="tabela-wrap"><table class="tabela" style="margin-top:12px"><thead><tr><th>Mês</th><th class="num">Horas dadas</th><th class="num">Valor dadas</th><th class="num">Horas agendadas</th><th class="num">Valor agendadas</th></tr></thead>
    <tbody>${meses.map((m, i) => (m.horasD || m.horasA) ? `<tr><td>${cap(MESES[i])}</td><td class="num">${horasTxt(m.horasD)}</td><td class="num">${euro(m.dadas)}</td><td class="num">${horasTxt(m.horasA)}</td><td class="num">${euro(m.agendadas)}</td></tr>` : '').join('')}</tbody>
    <tfoot><tr><td>Total</td><td class="num">${horasTxt(soma(meses, m => m.horasD))}</td><td class="num">${euro(soma(meses, m => m.dadas))}</td><td class="num">${horasTxt(soma(meses, m => m.horasA))}</td><td class="num">${euro(soma(meses, m => m.agendadas))}</td></tr></tfoot></table></div>`;
  return `<div class="legenda-graf"><span><i class="sw" style="background:var(--s1)"></i>Dadas</span><span><i class="sw" style="background:var(--s2)"></i>Agendadas (confirmadas)</span></div>
    <div class="grafico-wrap" id="grafico-wrap" data-meses="${esc(JSON.stringify(meses))}" data-ano="${ano}"><div class="tip" id="grafico-tip" hidden></div></div>
    <div style="margin-top:10px"><button class="lig-peq" data-acao="verTabela" aria-expanded="${ui.verTabela}">${ui.verTabela ? 'Esconder tabela' : 'Ver como tabela'}</button></div>${ui.verTabela ? tabela : ''}`;
}
// O gráfico é desenhado à largura real do ecrã, para o texto ter sempre o mesmo tamanho
function ligarGrafico() {
  const wrap = document.getElementById('grafico-wrap');
  if (!wrap) return;
  const meses = JSON.parse(wrap.dataset.meses), ano = wrap.dataset.ano;
  const tip = document.getElementById('grafico-tip');
  const W = Math.max(300, Math.round(wrap.clientWidth)), estreito = W < 560;
  const H = estreito ? 220 : 260, ml = estreito ? 50 : 64, mr = 4, mt = 10, mb = 28;
  const pw = W - ml - mr, ph = H - mt - mb, cw = pw / 12, bw = Math.min(32, cw * 0.58);
  const max = Math.max(...meses.map(m => m.dadas + m.agendadas));
  const passo = passoBonito(max / 4), topo = Math.ceil(max / passo) * passo;
  const y = v => mt + ph * (1 - v / topo);
  const topoArred = (x, yy, w, hh, r) => { if (hh <= 0) return ''; r = Math.min(r, hh, w / 2); return `M${x},${yy + hh}V${yy + r}Q${x},${yy} ${x + r},${yy}H${x + w - r}Q${x + w},${yy} ${x + w},${yy + r}V${yy + hh}Z`; };
  const reto = (x, yy, w, hh) => hh > 0 ? `M${x},${yy}h${w}v${hh}h${-w}Z` : '';
  const mesAtual = ano === hoje().slice(0, 4) ? Number(hoje().slice(5, 7)) - 1 : -1;
  const fmtEixo = v => estreito && v >= 1000 ? `${num(v / 1000)} mil €` : EUR0.format(v);
  let grade = '', barras = '', hits = '', rotulos = '';
  for (let v = 0; v <= topo + 0.001; v += passo) {
    grade += `<line class="${v === 0 ? 'base' : 'grade'}" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/><text class="eixo" x="${ml - 8}" y="${y(v) + 4}" text-anchor="end">${esc(fmtEixo(v))}</text>`;
  }
  meses.forEach((m, i) => {
    const x = ml + cw * i + (cw - bw) / 2, base = mt + ph;
    const hD = ph * m.dadas / topo, hA = ph * m.agendadas / topo;
    if (m.agendadas > 0 && m.dadas > 0) barras += `<path class="b1" d="${reto(x, base - hD, bw, hD)}"/><path class="b2" d="${topoArred(x, base - hD - hA, bw, Math.max(0, hA - 2), 4)}"/>`;
    else if (m.dadas > 0) barras += `<path class="b1" d="${topoArred(x, base - hD, bw, hD, 4)}"/>`;
    else if (m.agendadas > 0) barras += `<path class="b2" d="${topoArred(x, base - hA, bw, hA, 4)}"/>`;
    hits += `<rect class="hit" data-i="${i}" x="${ml + cw * i}" y="${mt}" width="${cw}" height="${ph}" tabindex="0" role="img" aria-label="${esc(`${cap(MESES[i])}: dadas ${euro(m.dadas)}, agendadas ${euro(m.agendadas)}`)}"/>`;
    rotulos += `<text class="eixo ${i === mesAtual ? 'mes-atual' : ''}" x="${ml + cw * i + cw / 2}" y="${H - 8}" text-anchor="middle">${estreito ? MESES_CURTOS[i].charAt(0).toUpperCase() : MESES_CURTOS[i]}</text>`;
  });
  wrap.querySelector('svg')?.remove();
  wrap.insertAdjacentHTML('afterbegin', `<svg class="grafico" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="Valor bruto das sessões por mês em ${ano}">${grade}${hits}<g class="barras">${barras}</g>${rotulos}</svg>`);
  const g = wrap.querySelector('svg');
  const mostrar = rect => {
    const i = Number(rect.dataset.i), m = meses[i];
    g.querySelectorAll('.hit.on').forEach(x => x.classList.remove('on'));
    rect.classList.add('on');
    tip.innerHTML = `<strong>${cap(MESES[i])}</strong><span><i class="sw" style="background:var(--s1)"></i>Dadas: ${horasTxt(m.horasD)}, ${euro(m.dadas)}</span><span><i class="sw" style="background:var(--s2)"></i>Agendadas: ${horasTxt(m.horasA)}, ${euro(m.agendadas)}</span><span class="tip-total">Total: ${euro(m.dadas + m.agendadas)}</span>`;
    tip.hidden = false;
    const rb = rect.getBoundingClientRect(), wb = wrap.getBoundingClientRect();
    tip.style.left = Math.max(0, Math.min(rb.left - wb.left + rb.width / 2 - tip.offsetWidth / 2, wb.width - tip.offsetWidth)) + 'px';
    tip.style.top = '-8px';
  };
  const esconder = rect => { rect.classList.remove('on'); tip.hidden = true; };
  g.querySelectorAll('.hit').forEach(rect => {
    rect.addEventListener('mouseenter', () => mostrar(rect));
    rect.addEventListener('mouseleave', () => esconder(rect));
    rect.addEventListener('focus', () => mostrar(rect));
    rect.addEventListener('blur', () => esconder(rect));
    rect.addEventListener('click', () => mostrar(rect));
  });
}

function erroDeEntrada(e) {
  const m = String((e && e.message) || e);
  if (erroDeRede(e)) return 'Sem ligação à internet.';
  if (/invalid login credentials/i.test(m)) return 'Email ou palavra-passe errados.';
  if (/email not confirmed/i.test(m)) return 'Ainda falta confirmar o email: abre a mensagem que recebeste do Supabase.';
  if (/rate limit|too many/i.test(m)) return 'Demasiadas tentativas. Espera uns minutos e tenta outra vez.';
  if (/different from the old|same password/i.test(m)) return 'A nova palavra-passe tem de ser diferente da anterior.';
  if (/password/i.test(m)) return 'Essa palavra-passe não serve: usa pelo menos 8 carateres, com letras e números.';
  return `Não foi possível: ${m}`;
}

function calcularGeracao(fd, ini0) {
  const inicio = fd.get('inicio_data'), total = Number(fd.get('total')), hi = fd.get('h_inicio'), hf = fd.get('h_fim');
  const dias = fd.getAll('dias').map(Number), saltar = !!fd.get('saltar_feriados');
  if (!dataValida(inicio || '')) return { erro: 'Indica a primeira data.' };
  if (!(total > 0)) return { erro: 'Indica quantas horas queres agendar.' };
  if (!hi || !hf || minutos(hf) <= minutos(hi)) return { erro: 'A hora de fim tem de ser depois da hora de início.' };
  if (!dias.length) return { erro: 'Escolhe pelo menos um dia da semana.' };
  const excl = new Set();
  for (const t of String(fd.get('excluir') || '').split(/[,;\s]+/).filter(Boolean)) {
    const m = t.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?$/);
    if (m) { const iso = isoDePartes(+m[1], +m[2], m[3] || dataDe(inicio).getFullYear() + (+m[2] < dataDe(inicio).getMonth() + 1 ? 1 : 0)); if (iso) excl.add(iso); }
  }
  const dur = (minutos(hf) - minutos(hi)) / 60;
  const out = [], saltadas = [];
  let d = inicio, falta = total, guarda = 0;
  while (falta > 0.001 && guarda++ < 800) {
    const wd = dataDe(d).getDay();
    if (dias.includes(wd)) {
      if (saltar && feriado(d)) saltadas.push(`${fmtData(d)} (${feriado(d)})`);
      else if (excl.has(d)) saltadas.push(`${fmtData(d)} (escolheste saltar)`);
      else { const hs = Math.min(dur, falta); out.push({ data: d, inicio: hi, fim: hhmm(minutos(hi) + hs * 60) }); falta = arred(falta - hs); }
    }
    d = somaDias(d, 1);
  }
  return { sessoes: out, saltadas };
}

// Os três blocos de Definições: qualquer Guardar grava também os outros que tenham alterações, para nada se perder no render seguinte.
const DEFINICOES = { perfil: 'os teus dados', valores: 'os valores', checklist: 'a lista de tarefas' };
function formAlterado(f) {   // mudou algum campo desde que o formulário foi desenhado?
  return [...f.elements].some(el => {
    if (el.tagName === 'SELECT') { const ini = [...el.options].find(o => o.defaultSelected) || el.options[0]; return !!ini && el.value !== ini.value; }
    if (el.type === 'checkbox' || el.type === 'radio') return el.checked !== el.defaultChecked;
    return 'defaultValue' in el && el.value !== el.defaultValue;
  });
}

  pedidoCriar: d => {
    const p = db.pedidos.find(x => x.id === d.pedido_id);
    if (!d.designacao.trim()) return 'Indica a designação.';
    const erros = [], sessoes = [];
    d.sessoes.split('\n').map(l => l.trim()).filter(Boolean).forEach((l, i) => {
      const m = l.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})\s+(\d{1,2})[:h](\d{2})\s*(?:-|–|—|a|às)\s*(\d{1,2})[:h](\d{2})$/i);
      const iso = m && isoDePartes(+m[1], +m[2], m[3]);
      if (!m || !iso) { erros.push(`linha ${i + 1} ("${l}")`); return; }
      const ini = `${pad(+m[4])}:${m[5]}`, fim = `${pad(+m[6])}:${m[7]}`;
      if (minutos(fim) <= minutos(ini)) { erros.push(`linha ${i + 1} (o fim é antes do início)`); return; }
      sessoes.push({ data: iso, inicio: ini, fim });
    });
    if (erros.length) return `Corrige as sessões: ${erros.join(', ')}. Formato: dd/mm/aaaa hh:mm-hh:mm`;
    let entidade_id = d.entidade_id;
    if (entidade_id === '__nova') {
      const nome = String(d.nova_entidade || '').trim();
      if (!nome) return 'Indica o nome da nova entidade.';
      const email = emailRemetente(p.remetente);
      entidade_id = criarEntidade({ nome, email, dominio_email: dominio(email), contacto_nome: nomeRemetente(p.remetente) }).id;
    }
    const extras = d.documentos.split('\n').map(x => x.trim()).filter(x => x && !/contrato|declara/i.test(x));
    const f = criarFormacao({ designacao: d.designacao.trim(), entidade_id, estado: d.estado, referencial: d.referencial, codigo: d.codigo.trim(), codigo_acao: d.codigo_acao.trim(), turma: d.turma.trim(), local: d.local.trim(), modalidade: d.modalidade, horas_previstas: Number(d.horas_previstas) || soma(sessoes, horasSessao), valor_hora: Number(d.valor_hora) || 0, prazo_resposta: d.prazo_resposta || null, coordenador_nome: d.coordenador_nome.trim(), coordenador_contacto: d.coordenador_contacto.trim(), pedido_id: p.id }, extras);
    sessoes.forEach(s => db.sessoes.push(novaSessao(f.id, s)));
    p.estado = 'convertido'; p.formacao_id = f.id;
    registar(`Formação criada a partir do email "${p.assunto}"`, f.id);
    aviso('Formação criada');
    return { ir: '#/formacao/' + f.id };
  }
};

/* ---------- Ligação dos eventos ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-acao]');
  if (!b) return;
  const fn = ACOES[b.dataset.acao];
  if (fn) { e.preventDefault(); fn(b.dataset, b, e); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-mudar]');
  if (el && MUDANCAS[el.dataset.mudar]) MUDANCAS[el.dataset.mudar](el);
});
document.addEventListener('input', e => {
  if (e.target.matches('[data-pesquisa]')) { ui.pesquisa = e.target.value; cache.clear(); document.getElementById('lista-formacoes').innerHTML = listaFormacoes(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('[data-enter]')) { e.preventDefault(); ACOES[e.target.dataset.enter](e.target.dataset); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const r = FORMULARIOS[f.dataset.form](Object.fromEntries(new FormData(f)), f);
  if (typeof r === 'string') { aviso(r); return; }
  if (DEFINICOES[f.dataset.form]) {
    const outros = [...document.querySelectorAll('form[data-form]')].filter(o => o !== f && DEFINICOES[o.dataset.form] && formAlterado(o));
    outros.forEach(o => FORMULARIOS[o.dataset.form](Object.fromEntries(new FormData(o)), o));
    const gravados = Object.keys(DEFINICOES).filter(k => [f, ...outros].some(o => o.dataset.form === k)).map(k => DEFINICOES[k]);
    if (outros.length) aviso(`Ficou tudo guardado: ${gravados.join(', ').replace(/, ([^,]*)$/, ' e $1')}.`);
  }
  guardar();
  if (r && r.ir) ir(r.ir); else render();
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); document.getElementById('conteudo').focus({ preventScroll: true }); });
document.addEventListener('submit', async e => {   // entrar na conta e mudar a palavra-passe
  const f = e.target.closest('form[data-conta]');
  if (!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f)), erroEl = f.querySelector('.erro-form'), botao = f.querySelector('[type=submit]');
  const erro = m => { erroEl.textContent = m; erroEl.hidden = false; botao.disabled = false; };
  botao.disabled = true;
  if (f.dataset.conta === 'entrar') {
    const email = String(d.email || '').trim();
    ui.emailEntrar = email; ui.msgEntrar = '';
    if (!email || !d.palavra) return erro('Escreve o email e a palavra-passe.');
    const { error } = await sb.auth.signInWithPassword({ email, password: d.palavra });
    if (error) return erro(erroDeEntrada(error));
  } else {
    if (String(d.palavra || '').length < 8) return erro('A palavra-passe tem de ter pelo menos 8 carateres.');
    const { error } = await sb.auth.updateUser({ password: d.palavra });
    if (error) return erro(erroDeEntrada(error));
    ui.novaPalavra = false; history.replaceState(null, '', location.pathname + '#/painel');
    aviso('Palavra-passe guardada'); render();
  }
});
window.addEventListener('storage', e => { if (!REMOTO && e.key === CHAVE && e.newValue) { try { db = normalizar(JSON.parse(e.newValue)); render(); } catch (err) { /* ignorar */ } } });

// Instalar no telemóvel (só quando a app está publicada num endereço web)
if (/^https?:$/.test(location.protocol)) {
  const m = document.createElement('link'); m.rel = 'manifest'; m.href = 'manifest.webmanifest'; document.head.appendChild(m);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}

if (REMOTO) {
  iniciarRemoto();
  window.addEventListener('online', () => { if (sessao && db) { if (porGravar()) sincronizar(); pedirRecarga(); } });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && sessao && db) pedirRecarga(); });
  window.addEventListener('beforeunload', e => { if (sessao && db && (sincronizacao || porGravar())) { e.preventDefault(); e.returnValue = ''; } });
} else {
  carregar();
  render();
}
</script>
